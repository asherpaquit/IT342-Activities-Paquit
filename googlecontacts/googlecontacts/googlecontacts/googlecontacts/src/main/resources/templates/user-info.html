<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Info - Google Contacts</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap');

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('/pictures/medieval_background.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Uncial Antiqua', cursive;
            color: #3a3a3a;
        }
        .container {
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            background: #f4f1e8;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.3);
            border: 8px solid #3a3a3a;
            text-align: center;
            position: relative;
        }
        .container:before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: url('/pictures/parchment_texture.png');
            opacity: 0.6;
            z-index: -1;
        }
        .user-info {
            padding: 20px;
            background: linear-gradient(145deg, #5a5a5a, #3a3a3a);
            color: #eae1c9;
            border-radius: 12px;
            display: flex;
            align-items: center;
            text-align: left;
            border: 3px solid #eae1c9;
        }
        .profile-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 15px;
            object-fit: cover;
            border: 4px solid #eae1c9;
        }
        .user-details h3 {
            margin: 0;
            font-size: 1.8rem;
        }
        .user-details p {
            margin: 5px 0 0;
            font-size: 1.2rem;
            opacity: 0.9;
        }
        .nav-buttons {
            margin-top: 20px;
        }
        .btn-custom {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #3a3a3a;
            color: #eae1c9;
            padding: 12px 20px;
            font-size: 1.2rem;
            border-radius: 10px;
            border: 2px solid #eae1c9;
            transition: background 0.3s ease, transform 0.2s;
            text-decoration: none;
            font-weight: 700;
        }
        .btn-custom:hover {
            background: #5a5a5a;
            transform: scale(1.05);
        }
        .btn-custom i {
            font-size: 1.4rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-3">User Information</h2>
    <div class="user-info">
        <img th:if="${pictureUrl}" th:src="${pictureUrl}" class="profile-image" alt="Profile picture">
        <div class="user-details">
            <h3>Welcome, <span th:text="${name}">User</span>!</h3>
            <p>Email: <span th:text="${email}">email@example.com</span></p>
        </div>
    </div>
    <div class="nav-buttons d-flex justify-content-between mt-4">
        <a href="/contacts" class="btn-custom"><i class="bi bi-person-lines-fill"></i> My Contacts</a>
        <a href="/logout" class="btn-custom"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>
</div>
</body>
</html>
