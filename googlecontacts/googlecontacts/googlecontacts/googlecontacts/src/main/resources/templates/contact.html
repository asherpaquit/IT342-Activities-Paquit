<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Contacts - Google Contacts Integration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <style>
        body {
            background: url('/pictures/parchment-texture.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding-top: 20px;
            font-family: 'Old English Text MT', serif;
            color: #2c2c2c;
        }
        .container {
            max-width: 100%;
            padding-left: 30px;
            padding-right: 30px;
        }
        .card-custom {
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            background-color: #d4d4d4;
            border: 3px solid #3a3a3a;
        }
        .card-header-custom {
            background: #3a3a3a;
            color: #f0f0f0;
            border-radius: 12px 12px 0 0;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .btn-custom {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #4a4a4a;
            color: #f0f0f0;
            padding: 10px 18px;
            font-size: 1rem;
            border-radius: 8px;
            transition: background 0.3s ease;
            text-decoration: none;
            font-weight: bold;
            border: none;
            white-space: nowrap;
        }
        .btn-custom:hover {
            background-color: #2c2c2c;
            color: #ffffff;
        }
        .btn-custom i {
            font-size: 1.2rem;
        }
        .btn-danger {
            background-color: #4a4a4a;
            border: none;
            transition: background 0.3s ease;
        }
        .btn-danger:hover {
            background-color: #2c2c2c;
        }
        .table-responsive {
            overflow-x: auto;
            max-width: 100%;
        }
        .table-custom {
            width: 100%;
            table-layout: auto;
            background-color: #e0e0e0;
            border: 2px solid #3a3a3a;
        }
        .table-custom th, .table-custom td {
            text-align: center;
            vertical-align: middle;
            padding: 12px;
            white-space: normal;
            border: 1px solid #3a3a3a;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .btn-group .btn {
            font-size: 1rem;
            padding: 10px 16px;
        }
        .btn-primary {
            background-color: #4a4a4a;
            border: none;
        }
        .btn-primary:hover {
            background-color: #2c2c2c;
        }
        .btn-secondary {
            background-color: #9a9a9a;
            border: none;
        }
        .btn-secondary:hover {
            background-color: #5a5a5a;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📖 The Grand Ledger of Contacts</h2>
        <div>
            <a href="/user-info" class="btn btn-custom">
                <i class="bi bi-arrow-left-circle"></i> Return to the Kingdom
            </a>
            <a href="/contact/add-form" class="btn btn-custom">
                <i class="bi bi-plus-circle"></i> Inscribe a New Contact
            </a>
        </div>
    </div>

    <div class="alert alert-info" th:if="${contacts == null || contacts.isEmpty()}">
        <i class="bi bi-info-circle"></i> The ledger is empty. Click <b>"Inscribe a New Contact"</b> to begin.
    </div>

    <div class="table-responsive" th:unless="${contacts == null || contacts.isEmpty()}">
        <table class="table table-bordered table-custom">
            <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="contact : ${contacts}">
                <td>
                    <span th:if="${not #lists.isEmpty(contact.names)}" th:text="${contact.names[0].displayName}">Name</span>
                    <span th:unless="${not #lists.isEmpty(contact.names)}">N/A</span>
                </td>
                <td>
                    <span th:if="${not #lists.isEmpty(contact.emailAddresses)}" th:text="${contact.emailAddresses[0].value}">Email</span>
                    <span th:unless="${not #lists.isEmpty(contact.emailAddresses)}">N/A</span>
                </td>
                <td>
                    <span th:if="${not #lists.isEmpty(contact.phoneNumbers)}" th:text="${contact.phoneNumbers[0].value}">Phone</span>
                    <span th:unless="${not #lists.isEmpty(contact.phoneNumbers)}">N/A</span>
                </td>
                <td>
                    <div class="btn-group">
                        <a th:href="@{'/contacts/edit/' + ${contact.resourceName}}" class="btn btn-primary">
                            <i class="bi bi-pencil"></i> Amend Record
                        </a>
                        <a th:href="@{'/contacts/delete/' + ${contact.resourceName}}" class="btn btn-danger"
                           onclick="return confirm('Are you certain you wish to remove this entry?')">
                            <i class="bi bi-trash"></i> Expunge Record
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
</body>
</html>
