<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Contact</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('/pictures/parchment-texture.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Old English Text MT', serif;
            color: #2c2c2c;
        }
        .card {
            max-width: 500px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
            background-color: #d4d4d4;
            border: 3px solid #3a3a3a;
        }
        .card-header {
            background: #3a3a3a;
            color: #f0f0f0;
            text-align: center;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .form-control {
            border-radius: 8px;
            background-color: #e0e0e0;
            border: 2px solid #3a3a3a;
        }
        .btn {
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 1rem;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #4a4a4a;
            border: none;
            color: #f0f0f0;
        }
        .btn-primary:hover {
            background-color: #2c2c2c;
        }
        .btn-secondary {
            background-color: #9a9a9a;
            border: none;
        }
        .btn-secondary:hover {
            background-color: #5a5a5a;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card">
        <div class="card-header">
            ✏️ Amend the Contact Scroll
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:if="${contact != null}" th:action="@{'/contacts/edit/' + ${contact.resourceName}}" method="POST">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="mb-3">
                    <label for="displayName" class="form-label">Name</label>
                    <input type="text" class="form-control" id="displayName" name="displayName"
                           th:value="${not #lists.isEmpty(contact.names) ? contact.names[0].displayName : ''}" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email"
                           th:value="${not #lists.isEmpty(contact.emailAddresses) ? contact.emailAddresses[0].value : ''}">
                </div>

                <div class="mb-3">
                    <label for="phoneNumber" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber"
                           th:value="${not #lists.isEmpty(contact.phoneNumbers) ? contact.phoneNumbers[0].value : ''}">
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/contacts" class="btn btn-secondary"><i class="bi bi-arrow-left-circle"></i> Return to the Ledger</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Seal the Amendment</button>
                </div>
            </form>

            <div th:if="${contact == null}" class="alert alert-danger text-center mt-3">
                <i class="bi bi-exclamation-triangle"></i> This scroll cannot be found.<br>
                <a href="/contacts" class="btn btn-link">Return to the Ledger</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
